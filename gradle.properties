# ============================================================
# File: gradle.properties
# Auto Caller — JVM & AndroidX project-wide properties.
# ============================================================

# Gradle JVM settings — Android Gradle Plugin 8.x requires
# at least JDK 17 to run the build, even if source/target
# compatibility is set to Java 11.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Run Gradle config out-of-process for faster incremental builds.
org.gradle.configureondemand=true

# Use AndroidX artifacts unconditionally (no legacy support library).
android.useAndroidX=true

# Non-transitive R classes — faster build, smaller R-class footprint.
android.nonTransitiveRClass=true

# Default keystore credentials placeholder for release builds.
# Override locally in ~/.gradle/gradle.properties when signing.
AUTO_CALLER_STORE_FILE=
AUTO_CALLER_STORE_PASSWORD=
AUTO_CALLER_KEY_ALIAS=
AUTO_CALLER_KEY_PASSWORD=
